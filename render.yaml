# Render Blueprint for the LEAN God's Eye View.
#
# Serves the pre-built static app + reuses the /api/* proxy plugins via
# server-lean.mjs. No Vite dev server at runtime, so the $7 / 512 MB Starter
# plan is enough (the old server.mjs needed the $25 / 2 GB plan).
#
# By hand: New + -> Web Service -> this repo -> branch feat/lean ->
#   Runtime "Docker" -> Plan "Starter" -> Health Check Path "/healthz".

services:
  - type: web
    name: godseye-view
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: feat/lean
    plan: starter            # 512 MB — no Vite dev server at runtime
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      # --- gate (set real values in the dashboard) ---
      - key: GODSEYE_USER
        sync: false
      - key: GODSEYE_PASS
        sync: false
      # --- data keys (set values in the dashboard, never commit) ---
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AISSTREAM_API_KEY
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      # --- non-secret config ---
      - key: OPENSKY_AUTH_MODE
        value: anon
      - key: OPENAI_REALTIME_VOICE
        value: ballad
      - key: NODE_ENV
        value: production
      # - key: TOMTOM_API_KEY      # optional: real traffic; keyless runs in simulation
      #   sync: false
